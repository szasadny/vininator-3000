# Harmonize multilabel food-pairing classifier (Phase 4 secondary target).
# `vininator train harmonize --config configs/harmonize_v1.yaml`
# One MultiLogloss model over all pair_* columns; per-label thresholds are
# tuned on the eval fold and frozen into the bundle (see models/harmonize.py).
#
# Trains on the wine-vintage aggregated table (one row per wine × vintage,
# ~21× smaller than the raw rating rows) — see models/dataset.py.
name: harmonize_v1

catboost_params:
  iterations: 1000
  depth: 8
  learning_rate: 0.05
  l2_leaf_reg: 3.0
  od_type: Iter
  od_wait: 100
  task_type: CPU
  # Same CPU speed knobs as rating_v1 — see the comments there.
  max_ctr_complexity: 1
  one_hot_max_size: 8
  thread_count: 10
  allow_writing_files: true  # enables crash snapshots, see rating_v1.yaml

data:
  sample_frac: null
  max_rows: null
  seed: 42
