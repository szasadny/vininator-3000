# Fast smoke config for the Body + Acidity classifiers. NOT a real run:
# 20 iterations, no early stopping. Pair with --sample-frac, e.g.
#   vininator train profile --config configs/profile_smoke.yaml --sample-frac 0.02 --no-track
name: profile_smoke

catboost_params:
  iterations: 20
  depth: 4
  learning_rate: 0.3
  task_type: CPU

data:
  sample_frac: null
  max_rows: 50000
  seed: 42
